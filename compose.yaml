services:
  clubcheckapi:
    image: backend:latest
    build:
      context: .
      dockerfile: ClubCheckAPI/Dockerfile
#    command:
#      - dotnet ef
    environment:
      - ApiKey__Value=${API_KEY}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=${DB_CONN_STRING_CONTAINER}
    depends_on:
      - db
    ports:
      - "30021:8080"
    
  scraper:
    image: scraper:latest
    build:
      context: ./DataScraper
      dockerfile: Dockerfile
    ports:
      - "30022:3000"
    environment:
      NODE_ENV: $NODE_ENV
      NODE_HOST: $NODE_HOST
      NODE_PORT: $NODE_PORT
      NODE_API_KEY: $NODE_API_KEY

  db:
    image: postgres
    restart: always
    volumes:
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"

