services:
  clubcheckapi:
    image: backend:latest
    build:
      context: .
      dockerfile: ClubCheckAPI/Dockerfile
#    command:
#      - dotnet ef
    environment:
      - ApiKey__Value=${API_KEY}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=${DB_CONN_STRING_CONTAINER}
    depends_on:
      - db
    ports:
      - "30021:8080"
    
  scraper:
    image: scraper:latest
    build:
      context: ./DataScraper
      dockerfile: Dockerfile
    ports:
      - "30022:3000"
    depends_on:
      - clubcheckapi
    environment:
      - NODE_ENV=${NODE_ENV}
      - NODE_HOST=${NODE_HOST}
      - NODE_PORT=${NODE_PORT}
      - NODE_API_KEY=${NODE_API_KEY}
      - NODE_DATABASE_URL_POOLED=${NODE_DATABASE_URL_POOLED}
      - NODE_SCRAPER_API_URL=${NODE_SCRAPER_API_URL}
      - SCRAPING_API_KEY=${SCRAPING_API_KEY}
      - NODE_SCRAPER_API_TIMEOUT_MS=${NODE_SCRAPER_API_TIMEOUT_MS}
      - NODE_SCRAPER_CONCURRENCY=${NODE_SCRAPER_CONCURRENCY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - NODE_CLUBCHECK_API_URL=http://clubcheckapi:8080
      - NODE_CLUBCHECK_API_KEY=${API_KEY}
      - MUSICBRAINZ_API_URL=${MUSICBRAINZ_API_URL}
      - MUSICBRAINZ_USER_AGENT=${MUSICBRAINZ_USER_AGENT}
      - MUSICBRAINZ_MIN_INTERVAL_MS=${MUSICBRAINZ_MIN_INTERVAL_MS}
      - MUSICBRAINZ_INCLUDES=${MUSICBRAINZ_INCLUDES}

  db:
    image: postgres
    restart: always
    volumes:
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    
  db-scraper:
    image: postgres
    restart: always
    volumes:
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: ${NODE_DB_PASSWD}
      POSTGRES_USER: ${NODE_DB_USER}
      POSTGRES_DB: ${NODE_DB_NAME}
    ports:
      - "5433:5432"  

